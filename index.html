    // ── Profilo Instagram ──
    const INSTAGRAM_URL = "https://www.instagram.com/8_medis_9/";

    // ── Servizi (testi presi dalla scheda esistente) ──
    const SERVICES = [
      {
        title: "Lavavetri",
        icon: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/>',
        desc: "Pulizia professionale di vetrate per negozi, uffici e showroom. Pulizia di pannelli fotovoltaici per ripristinare resa ed efficienza dell'impianto. Interventi singoli o programmati su vetri, ingressi, telai, superfici esposte e moduli FV. Ambienti più luminosi e impianti più performanti.",
        gallery: []
      },
      {
        title: "Riqualificazione interni",
        icon: '<path d="M3 21h18"/><path d="M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6"/>',
        desc: "Rinnovo di arredi, porte, banconi, pareti e reception. Pellicole decorative effetto legno, pietra, metallo o colore. Alternativa pulita e veloce alla sostituzione. Ideale per aggiornare ambienti commerciali e professionali.",
        gallery: []
      },
      {
        title: "Controllo solare",
        icon: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
        desc: "Pellicole per ridurre calore, abbagliamento e raggi solari. Migliorano il comfort di uffici, negozi e showroom. Proteggono arredi, prodotti e superfici esposte. Una soluzione discreta per gestire luce e temperatura.",
        gallery: []
      },
      {
        title: "Auto aziendali",
        icon: '<path d="M5 17h14M3 17l2-6h14l2 6"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/><path d="M5 11V7h11l3 4"/>',
        desc: "Applicazione di loghi, scritte e grafiche su veicoli aziendali. Personalizzazione parziale o completa. Il mezzo diventa uno strumento di comunicazione visibile. Grafica chiara, leggibile e coerente con il brand.",
        gallery: []
      },
      {
        title: "Wrapping auto",
        icon: '<path d="M5 17h14M3 17l2-6h14l2 6"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/><path d="M12 11V4M9 7l3-3 3 3"/>',
        desc: "Cambio colore di auto tramite pellicole adesive professionali. Una soluzione per rinnovare l'aspetto del veicolo. Ampia scelta di colori e finiture opache, lucide o satinate. Applicazione curata per un risultato pulito e uniforme.",
        gallery: []
      }
    ];

    // ── Render delle schede ──
    const chevron = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';
    const servicesEl = document.getElementById('services');
    SERVICES.forEach((s, i) => {
      const btn = document.createElement('button');
      btn.className = 'service reveal';
      btn.style.animationDelay = (0.28 + i * 0.07).toFixed(2) + 's';
      // a fine animazione rimuovo 'reveal' così l'effetto hover/tap torna libero
      btn.addEventListener('animationend', () => btn.classList.remove('reveal'), { once: true });
      btn.innerHTML =
        '<div class="service__top">' +
          '<span class="service__ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + s.icon + '</svg></span>' +
          '<span class="service__title">' + s.title + '</span>' +
          '<span class="service__chev">' + chevron + '</span>' +
        '</div>' +
        '<p class="service__excerpt">' + s.desc + '</p>';
      btn.addEventListener('click', () => openModal(i));
      servicesEl.appendChild(btn);
    });

    // ── Modale ──
    const overlay = document.getElementById('modalOverlay');
    const titleEl = document.getElementById('modalTitle');
    const descEl = document.getElementById('modalDesc');
    const igEl = document.getElementById('modalIg');
    const galleryEl = document.getElementById('modalGallery');

    function openModal(i) {
      const s = SERVICES[i];
      titleEl.textContent = s.title;
      descEl.textContent = s.desc;
      igEl.href = INSTAGRAM_URL;
      if (s.gallery && s.gallery.length) {
        galleryEl.className = '';
        galleryEl.innerHTML = '<div class="modal__gallery-grid">' +
          s.gallery.map(src => '<img src="' + src + '" alt="' + s.title + '" loading="lazy">').join('') +
          '</div>';
      } else {
        galleryEl.className = 'modal__gallery';
        galleryEl.innerHTML =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>' +
          '<div>Galleria in arrivo.<br />Le immagini saranno caricate a breve.</div>';
      }
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeModal() {
      overlay.classList.remove('open');
      document.body.style.overflow = '';
    }
    document.getElementById('modalClose').addEventListener('click', closeModal);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    // ── Su desktop il mouse aggiunge un leggero parallax (il logo si muove comunque da solo) ──
    (function () {
      const tilt = document.getElementById('logoTilt');
      if (!tilt) return;
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      if (!(window.matchMedia && window.matchMedia('(pointer: fine)').matches)) return;

      let raf = null;
      window.addEventListener('pointermove', (e) => {
        if (raf) return;
        raf = requestAnimationFrame(() => {
          raf = null;
          const x = (e.clientX / window.innerWidth - 0.5) * 1.3;
          const y = (e.clientY / window.innerHeight - 0.5) * 1.3;
          tilt.style.transform =
            'rotateY(' + (x * 12).toFixed(1) + 'deg) rotateX(' + (-y * 12).toFixed(1) + 'deg)';
        });
      });
    })();
  </script>
</body>
</html>
